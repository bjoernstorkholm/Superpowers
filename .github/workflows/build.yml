name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Applications.sln
      - name: Build
        run: dotnet build Applications.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Applications.sln --configuration Release --no-build --no-restore