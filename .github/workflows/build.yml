name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore Blazor and WPF
        run: dotnet restore Applications.slnx
      - name: Build Blazor and WPF
        run: dotnet build Applications.slnx --configuration Release --no-restore